<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sexy Blacks</title>
<meta name="theme-color" content="#07070B" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />

<!-- Start the data + poster fetches before anything else parses. -->
<script>window.__profilesReq = fetch('/profiles.json').then(function (r) {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});</script>
<link rel="preload" as="image" href="/assets/posters/main-bg.jpg" />
<link rel="modulepreload" href="/assets/site.js" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="world">
    <main class="directory">
      <div class="dir-inner">
        <div id="grid" class="grid"></div>
      </div>
    </main>
  </div>

  <noscript>
    <p class="empty-state" style="text-align:center">This page needs JavaScript.</p>
  </noscript>

  <script type="module">
    import {
      renderDirectory, mountBackground, createAudio, createEnterGate, mountAmbience,
    } from '/assets/site.js';

    const MAIN_BG_VIDEO  = '/assets/videos/main-bg.mp4';
    const MAIN_BG_POSTER = '/assets/posters/main-bg.jpg';
    const MAIN_BG_AUDIO  = '/assets/audio/main-theme.mp3';

    mountAmbience();

    // Media starts buffering immediately, behind the gate — the gate
    // shows the blurred poster meanwhile, so entering is instant.
    const bg = MAIN_BG_VIDEO
      ? mountBackground({ video: MAIN_BG_VIDEO, poster: MAIN_BG_POSTER })
      : null;
    const audio = MAIN_BG_AUDIO ? createAudio(MAIN_BG_AUDIO, 0.5) : null;

    // Build the grid while the visitor is still on the gate.
    await renderDirectory(document.getElementById('grid'));

    await createEnterGate();

    bg?.reveal();
    audio?.start();
  </script>
</body>
</html>
