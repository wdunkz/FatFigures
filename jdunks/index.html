<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dunks</title>
<meta name="theme-color" content="#07070B" />
<link rel="icon" type="image/png" href="/assets/dunks.png" />

<!-- Start the data + poster fetches before anything else parses. -->
<script>window.__profilesReq = fetch('/profiles.json').then(function (r) {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});</script>
<link rel="preload" as="image" href="/assets/posters/dunks.jpg" />
<link rel="preload" as="image" href="/assets/avatars/dunks.png" />
<link rel="modulepreload" href="/assets/site.js" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="world">
    <div class="stage">
      <div id="card" class="card"><p class="card-empty">loading&hellip;</p></div>
    </div>
  </div>

  <noscript>
    <p class="empty-state" style="text-align:center">This page needs JavaScript.</p>
  </noscript>

  <script type="module">
    // Identical in every profile folder: renderProfile() reads the slug
    // from the URL and pulls everything else from profiles.json.
    import { renderProfile, mountAmbience } from '/assets/site.js';

    mountAmbience();
    renderProfile(document.getElementById('card'));
  </script>
</body>
</html>
