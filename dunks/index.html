<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dunks</title>
<link rel="icon" type="image/png" href="/assets/dunks.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div id="aura"></div>

  <div class="stage">
    <div id="card" class="card">
      <p class="card-empty">loading…</p>
    </div>
  </div>

  <script type="module">
    import { loadProfiles, paintAura, avatarNode, ICONS, SOUND_ICONS, setupBackgroundVideo, setupAudioControl } from '/assets/site.js';

    // This file is identical in every profile folder — it figures out
    // which profile to show from the URL, e.g. /dunks/ -> slug "dunks".
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const card = document.getElementById('card');

    try {
      const profiles = await loadProfiles();
      const profile = profiles.find(p => p.slug === slug);

      if (!profile) {
        document.title = 'not found';
        paintAura(slug);
        card.innerHTML = `<p class="card-empty">No profile found for <code>/${slug}</code>.<br>Add an entry with that slug to <code>profiles.json</code>.</p>`;
      } else {
        document.title = profile.name;

        // Background: a video (if set) replaces the generated aura.
        if (profile.video) {
          setupBackgroundVideo(profile.video);
        } else {
          paintAura(profile.slug);
        }

        // Music: only added to the page if this profile has an audio track.
        if (profile.audio) {
          setupAudioControl(profile.audio);
        }

        card.innerHTML = '';
        card.appendChild(avatarNode(profile, 'avatar'));

        const name = document.createElement('h1');
        name.className = 'name';
        name.textContent = profile.name;
        card.appendChild(name);

        if (profile.username) {
          const uname = document.createElement('p');
          uname.className = 'username';
          uname.textContent = profile.username;
          card.appendChild(uname);
        }

        const links = document.createElement('div');
        links.className = 'links';
        for (const link of profile.links || []) {
          const a = document.createElement('a');
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = link.type;
          a.innerHTML = ICONS[link.type] || ICONS.website;
          links.appendChild(a);
        }
        card.appendChild(links);
      }
    } catch (err) {
      card.innerHTML = `<p class="card-empty">Couldn't load profiles.json — ${err.message}</p>`;
    }
  </script>
</body>
</html>
